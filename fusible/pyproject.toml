[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusible"
version = "0.1.0"
description = "Capa de contencion temporal sensor-agnostica para sistemas agenticos (I2t / CUSUM / EWMA + calibracion + flight recorder auditable)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PROPRIETARY-PENDING" }  # decision de licencia pendiente (Richie): Apache-2.0 vs BSL
authors = [{ name = "Richie / 4R2" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
