[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisbench"
version = "1.0.0"
description = "AegisBench: Un benchmark independiente y reproducible para Sistemas de Gobernanza de IA en tiempo de ejecución"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AegisBench Authors", email = "author@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "numpy>=1.22.0",
    "requests>=2.27.0",
    "jinja2>=3.0.0",
]

[project.scripts]
aegisbench = "aegisbench.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisbench"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# fusible/ es un paquete independiente (repo canonico: fuse-ai) con su propio
# ciclo de lint/tests; aqui vive como snapshot y no lo lintea este CI.
extend-exclude = ["fusible", "evidence", "reports*", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts de experimento: notacion matematica en mayusculas (T, S, K, P, X, C_NI)
# es la convencion correcta en este dominio, y el ajuste de sys.path debe ocurrir
# antes de los imports del SDK (E402). Se lintean errores reales, no estilo mate.
"scripts/*.py" = ["N802", "N803", "N806", "N816", "E402"]
# Renderers legacy: variables de contexto leidas del JSON que quedan a mano.
"scripts/render_atbench_v5_semantic.py" = ["N802", "N803", "N806", "E402", "F841"]
"scripts/eval_atbench_v5_semantic.py" = ["N802", "N803", "N806", "E402", "F841"]
"adapters_external/*.py" = ["N802", "N803", "N806", "E402"]
# sklearn expone el hiperparametro de regularizacion como C (mayuscula).
"src/aegisbench/sensors/turn_sensors.py" = ["N803"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access"
]
